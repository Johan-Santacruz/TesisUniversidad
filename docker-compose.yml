# Tres servicios: la API, el frontend estático y Caddy delante de ambos.
#
# El certificado y el dominio NO se gestionan aquí: los termina el proxy del
# anfitrión (el del proveedor del servidor). Caddy se queda como repartidor
# interno —/api a la API, el resto al frontend— y publica HTTP plano en el 80,
# que es por donde entra ese proxy. Por eso el 443 no se abre.
services:
  api:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Docker todo es HTTP; el TLS lo termina Caddy.
      SENDA_DATABASE_URL: sqlite:////datos/senda.db
      SENDA_STORAGE_DIR: /datos/storage
      SENDA_FRONTEND_ORIGIN: https://${SENDA_DOMINIO}
    volumes:
      # La base y los testimonios cifrados sobreviven a cada despliegue.
      - datos:/datos
      # Los pesos de BETO se copian una vez al servidor y se montan de sólo
      # lectura: nada de lo que corre aquí tiene por qué modificarlos.
      - ./Backend/ml-artifacts:/app/ml-artifacts:ro
      # Sesión de YouTube para la ingesta por enlace, cuando se usa. Vive fuera
      # de Backend/ —que es el contexto de construcción— para que no quede
      # horneada en ninguna capa de la imagen, y entra de sólo lectura. Si la
      # carpeta no existe, Docker la crea vacía y no pasa nada: sin
      # SENDA_LINK_COOKIES_FILE la descarga sigue yendo anónima.
      - ./secretos:/secretos:ro
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        # Vacío a propósito: el frontend llama a /api del mismo origen y Caddy
        # lo reparte. Así no hay CORS ni una URL absoluta que se quede vieja.
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Solo el 80, y en HTTP plano: el proxy del anfitrión entra por aquí,
      # termina el TLS de cara a internet y reparte el dominio. El 443 no se
      # abre porque el certificado no se emite en esta máquina.
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  datos:

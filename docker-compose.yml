# Tres servicios: la API, el frontend estático y Caddy delante de ambos.
# Caddy es quien obtiene y renueva el certificado de senda.casa por su cuenta;
# por eso los puertos 80 y 443 son suyos y nadie más los expone.
services:
  api:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Docker todo es HTTP; el TLS lo termina Caddy.
      SENDA_DATABASE_URL: sqlite:////datos/senda.db
      SENDA_STORAGE_DIR: /datos/storage
      SENDA_FRONTEND_ORIGIN: https://${SENDA_DOMINIO}
    volumes:
      # La base y los testimonios cifrados sobreviven a cada despliegue.
      - datos:/datos
      # Los pesos de BETO se copian una vez al servidor y se montan de sólo
      # lectura: nada de lo que corre aquí tiene por qué modificarlos.
      - ./Backend/ml-artifacts:/app/ml-artifacts:ro
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        # Vacío a propósito: el frontend llama a /api del mismo origen y Caddy
        # lo reparte. Así no hay CORS ni una URL absoluta que se quede vieja.
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Puerta en HTTP plano, atada al bucle local a propósito: desde internet
      # no se alcanza, pero sí desde la propia máquina. Eso basta para que
      # cualquiera con acceso SSH la reenvíe a su equipo con `ssh -L` y vea el
      # sistema mientras el anfitrión del proveedor siga quedándose con el 80
      # y el 443. cloudflared, si se usa, entra por la red de Docker.
      - "127.0.0.1:8080:8080"
    environment:
      SENDA_DOMINIO: ${SENDA_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados persisten: sin esto, cada reinicio pide uno nuevo y
      # Let's Encrypt limita a cinco por semana y dominio.
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  # El túnel sale desde aquí hacia Cloudflare, así que no necesita ningún
  # puerto abierto de entrada. Existe porque el anfitrión del proveedor se
  # queda con el 80 y el 443, y sin ellos Caddy no puede emitir certificado.
  #
  # Va en un perfil: sin token, `docker compose up -d` no debe intentar
  # levantarlo ni fallar por ello. Se arranca con:
  #   docker compose --profile tunel up -d
  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run --token ${SENDA_TUNNEL_TOKEN}
    depends_on:
      - proxy

volumes:
  datos:
  caddy-datos:
  caddy-config:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El video se sirve por rangos HTTP y puede pesar cientos de megas: sin
    # esto nginx corta la subida del testimonio en 1 MB.
    client_max_body_size 550M;

    # React Router resuelve las rutas en el navegador. Sin este reenvío,
    # recargar en /subir-video devuelve un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ninguna ruta de React Router tiene punto en el nombre: si lo tiene, es
    # un archivo (robots.txt, favicon, o una sonda que no existe) y no una
    # pantalla de la aplicación. Sin esto, el reenvío de arriba lo resolvía
    # con el index.html y un 200, un 404 encubierto que confundía a
    # Lighthouse y a cualquier rastreador.
    location ~ ^/[^/]+\.\w+$ {
        try_files $uri =404;
    }

    # Los archivos con huella en el nombre no cambian nunca; el index sí.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

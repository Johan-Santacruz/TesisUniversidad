[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "senda-backend"
version = "0.2.0"
description = "Backend seguro para el análisis inteligente de testimonios ficticios en SENDA"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.49,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "openai>=1.68,<2",
  "Pillow>=11,<13",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  # Sin import directo: FastAPI la exige para UploadFile/File en videos.py.
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0.38,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.4,<2",
  # Sin import directo: joblib deserializa los LabelEncoder de sklearn.
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  # El pin llegaba hasta <5, pero el modelo se entrenó y se verificó con la 5.x.
  # Dejarlo en 4.x haría que la imagen instalara una versión distinta de la probada.
  "transformers>=4.49,<6",
]
test = [
  "httpx>=0.28,<1",  # la usa fastapi.testclient.TestClient
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
senda = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "smoke: opt-in calls to real external AI providers using fictitious data only",
]

[tool.coverage.run]
branch = true
source = ["app"]
